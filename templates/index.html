<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emlak Fiyat Tahmincisi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --overlay-color: rgba(0, 0, 0, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            /* Arka plan görseli: Unsplash'ten kaliteli bir ev görseli çeker */
            background: var(--overlay-color) url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-blend-mode: darken;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 400px;
            text-align: center;
            color: white;
        }

        h2 {
            margin-bottom: 30px;
            font-weight: 600;
            color: var(--primary-green);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-green);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        button:hover {
            background-color: var(--dark-green);
            transform: translateY(-2px);
        }

        .result-box {
            margin-top: 30px;
            padding: 15px;
            background: rgba(46, 204, 113, 0.2);
            border-radius: 10px;
            border-left: 5px solid var(--primary-green);
        }

        .result-box h3 {
            margin: 0;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏡 Emlak Tahmin</h2>
        <form action="/predict" method="post">
            <div class="input-group">
                <label>Evin Alanı (sq ft)</label>
                <input type="number" name="area" placeholder="Örn: 1500" required>
            </div>
            <button type="submit">Tahmini Fiyatı Hesapla</button>
        </form>

        {% if prediction_text %}
            <div class="result-box">
                <h3>{{ prediction_text }}</h3>
            </div>
        {% endif %}
    </div>
</body>
</html>
